name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cargo:
    name: Cargo checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.96
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy

      - name: Standalone contract
        run: bash tests/standalone-contract.sh

      - name: Format
        run: cargo +1.96.0 fmt --all -- --check

      - name: Check
        run: cargo +1.96.0 check --workspace

      - name: Test
        run: cargo +1.96.0 test --workspace

      - name: Clippy
        run: cargo +1.96.0 clippy --workspace --all-targets -- -D warnings

  nix:
    name: Nix build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Standalone contract
        run: bash tests/standalone-contract.sh

      - name: Format Nix
        run: nix fmt -- --check

      - name: Build renderer
        run: nix build .#quicken-fb --no-link
