name: Scene Pack contract

on:
  pull_request:
    paths:
      - ".github/workflows/scene-pack-contract.yml"
      - "contracts/**"
      - "tools/ambient_validation/**"
      - "tests/fixtures/first-germination.scene.json"
      - "crates/visual-pack/src/lib.rs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/scene-pack-contract.yml"
      - "contracts/**"
      - "tools/ambient_validation/**"
      - "tests/fixtures/first-germination.scene.json"
      - "crates/visual-pack/src/lib.rs"
  workflow_dispatch:

permissions:
  contents: read

# This fast contract lane has its own cancellation group, so a renderer/Nix
# queue does not hold the schema and provenance result behind a heavyweight job.
concurrency:
  group: scene-pack-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scene-pack-contract:
    name: Schema, provenance and adversarial fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify vendored source identities
        run: python tools/ambient_validation/verify_vendor_snapshot.py

      - name: Install exact validator dependencies
        run: python -m pip install --disable-pip-version-check -r tools/ambient_validation/requirements.txt

      - name: Validate positive Scene Pack fixture
        run: python tools/ambient_validation/validate_scene_pack.py tests/fixtures/first-germination.scene.json

      - name: Run contract and adversarial tests
        run: python -m unittest discover -s tools/ambient_validation -p 'test_*.py' -v
