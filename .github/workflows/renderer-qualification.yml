name: renderer-qualification

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sovereign-boot-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-lockfile:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Generate workspace lockfile
        run: cargo generate-lockfile

      - name: Persist workspace lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1 && git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git add Cargo.lock
          git commit -m "build: add sovereign-boot renderer lockfile"
          git push origin HEAD:"${GITHUB_REF_NAME}"

  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Generate ephemeral validation lockfile
        run: cargo generate-lockfile

      - name: Verify renderer extraction boundary
        run: python3 scripts/verify-renderer-boundary.py

      - name: Check renderer
        run: cargo check -p symthaea-quicken-fb --locked --all-targets

      - name: Test renderer
        run: cargo test -p symthaea-quicken-fb --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

  qualify:
    needs: bootstrap-lockfile
    if: ${{ always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref != 'refs/heads/main' && needs.bootstrap-lockfile.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Refresh hardening branch after lock bootstrap
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Require committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.lock
          git ls-files --error-unmatch Cargo.lock >/dev/null

      - name: Verify renderer extraction boundary
        run: python3 scripts/verify-renderer-boundary.py

      - name: Check renderer
        run: cargo check -p symthaea-quicken-fb --locked --all-targets

      - name: Test renderer
        run: cargo test -p symthaea-quicken-fb --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy -p symthaea-quicken-fb --locked --all-targets --all-features -- -D warnings

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main as of 2026-09-09
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Run Nix qualification
        run: nix flake check

      - name: Emit qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          cat > qualification-receipt.json <<JSON
          {
            "schema": "luminous-sovereign-boot-renderer-qualification-v1",
            "validated_commit": "$(git rev-parse HEAD)",
            "trigger_commit": "${GITHUB_SHA}",
            "rustc": "$(rustc --version)",
            "cargo": "$(cargo --version)",
            "cargo_lock_sha256": "$(sha256sum Cargo.lock | cut -d' ' -f1)",
            "cargo_toml_sha256": "$(sha256sum Cargo.toml | cut -d' ' -f1)",
            "renderer_manifest_sha256": "$(sha256sum crates/quicken-fb/Cargo.toml | cut -d' ' -f1)",
            "flake_sha256": "$(sha256sum flake.nix | cut -d' ' -f1)",
            "boundary": "renderer-standalone-pass",
            "lifecycle_recovery": "not-extracted"
          }
          JSON

      - name: Upload qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sovereign-boot-renderer-qualification-${{ github.sha }}
          path: qualification-receipt.json
          if-no-files-found: error
          retention-days: 30
