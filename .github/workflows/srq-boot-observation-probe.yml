name: SRQ boot-observation D0 probe

on:
  pull_request:
    paths:
      - ".github/workflows/srq-boot-observation-probe.yml"
      - "tools/srq-boot-observation-probe/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/srq-boot-observation-probe.yml"
      - "tools/srq-boot-observation-probe/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0

      - name: Check formatting
        run: cargo fmt --manifest-path tools/srq-boot-observation-probe/Cargo.toml -- --check

      - name: Run read-only observation contract tests
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/srq-boot-observation-probe-test.log"
          cargo test --manifest-path tools/srq-boot-observation-probe/Cargo.toml --locked 2>&1 | tee "$log"
          grep -Fq 'test result: ok. 8 passed; 0 failed' "$log"
          echo "PASS: D0 diagnostic reports booted/current identity without authorizing release"

      - name: Preserve probe contract log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srq-boot-observation-probe-d0
          path: \${{ runner.temp }}/srq-boot-observation-probe-test.log
          if-no-files-found: ignore
          retention-days: 14
