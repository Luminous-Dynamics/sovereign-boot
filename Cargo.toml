# The public repository is composed of independently buildable package roots.
# Keep this index workspace empty: importing the legacy Symthaea tree here would
# make every Cargo operation resolve missing monorepo-relative path dependencies.
[workspace]
resolver = "2"
members = []
exclude = [
    "crates/quicken-fb",
    "crates/boot-lifecycle",
    "crates/spore-kernel",
    "crates/spore-kernel/fuzz",
    "validation/frame-audit",
    "validation/wgsl-check",
]
